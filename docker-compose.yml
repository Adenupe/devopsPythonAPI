services:
  fastapi: 
    build: ./
    ports: 
      - "8000:8000"
    networks: 
      - fastapi_network
    env_file:
      - .env
    environment:
      - Mongo_url
    depends_on: 
      - Mongodb

  Mongodb:
    image: mongo:latest
    ports: 
      - "27017:27017"
    networks: 
      - fastapi_network
    #volumes:
    #  - fastapi_volume:/app/data

networks:
  fastapi_network:
    driver: bridge

